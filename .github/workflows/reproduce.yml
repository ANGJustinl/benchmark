name: reproduce-without-model-calls
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - run: npm install --global --ignore-scripts typescript@5.8.3
      - run: python -m pip install -e '.[test]'
      - run: python analysis/summarize.py
      - run: python scripts/reproduce.py --tier unit --out /tmp/cb-unit
      - run: python scripts/reproduce.py --tier reference --out /tmp/cb-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contracts-python-${{ matrix.python }}
          path: |
            /tmp/cb-unit/
            /tmp/cb-reference/
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - run: npm install --global --ignore-scripts typescript@5.8.3
      - run: python -m pip install -e '.[test]'
      - run: docker pull python:3.12.14-slim@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f
      - run: python scripts/build_runtime_images.py --out /tmp/cb-images.json
      - run: python scripts/reproduce.py --tier docker --images /tmp/cb-images.json --out /tmp/cb-docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-evidence
          path: |
            /tmp/cb-images.json
            /tmp/cb-docker/
